# AICLIPER Fase 0C — Cloud Run Backend API Service Manifest (TEMPLATE)
#
# IMPORTANT:
#   This file is a staged-deployment template. Substitute all `${...}` variables using
#   `envsubst` or CI/CD before applying with:
#     envsubst < infra/cloud-run-api-service.yaml | gcloud run services replace - --region=${GCP_REGION}
#
# Staged Rollout / Canary Traffic Split:
#   1. Deploy new revision with `--no-traffic --tag=canary` or via manifest revision name.
#   2. Smoke test `/api/health` and `/api/v3/readiness` on the tagged canary URL.
#   3. Shift traffic gradually: 10% -> 50% -> 100% using `gcloud run services update-traffic`.
#
# Required Service Account:
#   `aicliper-api-sa@${GCP_PROJECT_ID}.iam.gserviceaccount.com`
#   Least-privilege roles:
#     - roles/cloudsql.client
#     - roles/storage.objectAdmin (scoped via IAM condition to the AICLIPER media bucket ONLY)
#     - roles/cloudtasks.enqueuer
#     - roles/run.invoker (scoped to the aicliper-render-worker Cloud Run Job)
#     - roles/iam.serviceAccountUser (scoped to aicliper-tasks-invoker-sa ONLY)
#     - roles/secretmanager.secretAccessor (scoped to SQL_PASSWORD, GEMINI_API_KEY, STREAM_TOKEN_SECRET)
#     - roles/logging.logWriter

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aicliper-api
  labels:
    app: aicliper
    component: backend-api
    phase: phase-0c
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cloudsql-instances: ${SQL_INSTANCE_CONNECTION_NAME}
        run.googleapis.com/cpu-throttling: "false"
    spec:
      serviceAccountName: aicliper-api-sa@${GCP_PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - name: api
          image: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/aicliper/api:${IMAGE_TAG}
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: NODE_ENV
              value: "production"
            - name: CLOUD_RUN_SERVICE_NAME
              value: "aicliper-api"
            - name: GCP_PROJECT_ID
              value: "${GCP_PROJECT_ID}"
            - name: GCP_REGION
              value: "${GCP_REGION}"
            - name: FIREBASE_PROJECT_ID
              value: "${FIREBASE_PROJECT_ID}"
            - name: CORS_ALLOWED_ORIGINS
              value: "${CORS_ALLOWED_ORIGINS}"
            - name: GCS_REQUIRED
              value: "true"
            - name: GCS_BUCKET_NAME
              value: "${GCS_BUCKET_NAME}"
            - name: GCS_SIGNED_URL_TTL_SECONDS
              value: "3600"
            - name: SQL_INSTANCE_CONNECTION_NAME
              value: "${SQL_INSTANCE_CONNECTION_NAME}"
            - name: SQL_DB_NAME
              value: "${SQL_DB_NAME}"
            - name: SQL_USER
              value: "${SQL_USER}"
            - name: PG_POOL_MAX
              value: "10"
            - name: CLOUD_RENDER_DISPATCH_ENABLED
              value: "true"
            - name: CLOUD_TASKS_LOCATION
              value: "${CLOUD_TASKS_LOCATION}"
            - name: CLOUD_TASKS_MEDIA_QUEUE
              value: "${CLOUD_TASKS_MEDIA_QUEUE}"
            - name: CLOUD_TASKS_AI_QUEUE
              value: "${CLOUD_TASKS_AI_QUEUE}"
            - name: CLOUD_TASKS_RENDER_QUEUE
              value: "${CLOUD_TASKS_RENDER_QUEUE}"
            - name: CLOUD_TASKS_PUBLISH_QUEUE
              value: "${CLOUD_TASKS_PUBLISH_QUEUE}"
            - name: WORKER_DISPATCH_BASE_URL
              value: "${WORKER_DISPATCH_BASE_URL}"
            - name: CLOUD_TASKS_OIDC_SA_EMAIL
              value: "aicliper-tasks-invoker-sa@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
            - name: CLOUD_TASKS_OIDC_AUDIENCE
              value: "${WORKER_DISPATCH_BASE_URL}"
            - name: CLOUD_RUN_RENDER_JOB_NAME
              value: "aicliper-render-worker"
            - name: WORKER_LOCK_TTL_SECONDS
              value: "2100"
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aicliper-sql-password
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aicliper-gemini-api-key
                  key: latest
            - name: STREAM_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: aicliper-stream-token-secret
                  key: latest
